plugins {
    id 'java'
    id 'war'
    id 'org.hidetake.ssh' version '2.11.2'
}

apply plugin: 'org.hidetake.ssh'

remotes {
    host {
        host = '54.254.156.100'
        user = 'ec2-user'
        identity = file('C:\\Users\\huynh\\.ssh\\victory24.pem')
        knownHosts = allowAnyHosts
    }
}

ssh.settings {
    knownHosts = allowAnyHosts
}

group 'com.thomas'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url "https://repo1.maven.org/maven2" }
    maven { url "https://mvnrepository.com/artifact/jstl/jstl" }
}

ext {
    junitVersion = '5.11.0'
}

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly 'jakarta.servlet:jakarta.servlet-api:5.0.0'

    implementation 'org.jdbi:jdbi3-core:3.25.0'

    implementation 'javax.mail:javax.mail-api:1.6.2'
    implementation 'com.sun.mail:javax.mail:1.6.2'

    implementation 'org.apache.httpcomponents:httpclient:4.5.13'
    implementation 'org.apache.httpcomponents:httpmime:4.5.13'
    implementation 'org.apache.httpcomponents:fluent-hc:4.5.13'

    implementation 'org.json:json:20210307'
    implementation 'com.google.code.gson:gson:2.8.8'
    implementation 'mysql:mysql-connector-java:8.0.30'

    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.2'
}

task docker_app_start {
    doLast {
        println 'begin docker_app_start'

        ssh.run {
            session(remotes.host) {
                execute 'docker stop tomcat10', ignoreError: true
                execute 'docker rm tomcat10', ignoreError: true
                execute '''
                    docker run -it --rm -d \
                    --name tomcat10 \
                    -v /usr/deploy:/usr/local/tomcat/webapps \
                    -p 8080:8080 \
                    tomcat:10.0
                '''
            }
        }
    }
}

task docker_upload_file_to_server {
    doLast {
        println 'begin docker_upload_file_to_server'
        ssh.run {
            session(remotes.host) {
                execute 'sudo chown -R ec2-user:ec2-user /usr/deploy'
                remove '/usr/deploy/ROOT.war'
                remove '/usr/deploy/ROOT/'
                remove '/usr/deploy/ROOT-1/'
                put from: "${project.projectDir}/build/libs/TTLTW-BanThatLung-1.0-SNAPSHOT.war",
                        into: "/usr/deploy/ROOT.war"
            }
        }
    }
}


task docker_deploy {
    dependsOn build
    dependsOn docker_upload_file_to_server
    dependsOn docker_app_start

    // Đảm bảo upload xong mới chạy docker
    tasks.docker_app_start.mustRunAfter docker_upload_file_to_server
}