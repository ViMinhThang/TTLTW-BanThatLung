home.story_title=STORIES, STYLE AND BELTS AT THOMAS, SINCE 1949
home.story_paragraph1=Sports help us stay healthy. Keep our minds sharp. Connect people together. Through sports, we have the power to change lives.
home.story_paragraph2=Whether it's inspiring athlete stories. Helping you get up and moving. Or sportswear with the most advanced technology to enhance your performance. Breaking your personal limits.
home.story_paragraph3=THOMAS is home to runners, basketball players, kids who love football, fitness enthusiasts. Those who like mountain climbing on weekends to escape the city. Yoga teachers spreading every movement. The 3-Stripe symbol appears in the music scene. On stage, at festivals. Our sportswear helps you focus before the starting whistle. Throughout the race. And when crossing the finish line.
home.story_paragraph4=We are here to support creators. Improve their game. Their lives. And change the world.
