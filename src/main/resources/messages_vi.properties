terms.content.usage=Ch\u00e0o m\u1eebng b\u1ea1n \u0111\u1ebfn v\u1edbi website c\u1ee7a ch\u00fang t\u00f4i. Khi truy c\u1eadp v\u00e0 s\u1eed d\u1ee5ng d\u1ecbch v\u1ee5 t\u1ea1i trang web n\u00e0y, b\u1ea1n \u0111\u1ed3ng \u00fd tu\u00e2n th\u1ee7 c\u00e1c \u0111i\u1ec1u kho\u1ea3n v\u00e0 \u0111i\u1ec1u ki\u1ec7n \u0111\u01b0\u1ee3c quy \u0111\u1ecbnh d\u01b0\u1edbi \u0111\u00e2y. Vui l\u00f2ng \u0111\u1ecdc k\u1ef9 c\u00e1c \u0111i\u1ec1u kho\u1ea3n n\u00e0y tr\u01b0\u1edbc khi s\u1eed d\u1ee5ng d\u1ecbch v\u1ee5 c\u1ee7a ch\u00fang t\u00f4i.

