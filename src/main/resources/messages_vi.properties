home.story_title=C\u00c2U CHUY\u1ec6N, PHONG C\u00c1CH V\u00c0 TH\u1eaeT L\u01af\u01a0NG T\u1ea0I THOMAS, T\u1eea N\u0102M 1949
home.story_paragraph1=Th\u1ec3 thao gi\u00fap ch\u00fang ta kh\u1ecfe m\u1ea1nh. Gi\u1eef cho t\u00e2m tr\u00ed t\u1ec9nh t\u00e1o. K\u1ebft n\u1ed1i m\u1ecdi ng\u01b0\u1eddi l\u1ea1i v\u1edbi nhau. Th\u00f4ng qua th\u1ec3 thao, ch\u00fang ta c\u00f3 s\u1ee9c m\u1ea1nh \u0111\u1ec3 thay \u0111\u1ed5i cu\u1ed9c s\u1ed1ng.
home.story_paragraph2=D\u00f9 \u0111\u00f3 l\u00e0 nh\u1eefng c\u00e2u chuy\u1ec7n v\u1ec1 c\u00e1c v\u1eadn \u0111\u1ed9ng vi\u00ean truy\u1ec1n c\u1ea3m h\u1ee9ng. Gi\u00fap b\u1ea1n \u0111\u1ee9ng d\u1eady v\u00e0 v\u1eadn \u0111\u1ed9ng. Hay trang ph\u1ee5c th\u1ec3 thao v\u1edbi c\u00f4ng ngh\u1ec7 ti\u00ean ti\u1ebfn nh\u1ea5t \u0111\u1ec3 n\u00e2ng cao hi\u1ec7u su\u1ea5t c\u1ee7a b\u1ea1n. Ph\u00e1 v\u1ee1 gi\u1edbi h\u1ea1n b\u1ea3n th\u00e2n.
home.story_paragraph3=THOMAS l\u00e0 ng\u00f4i nh\u00e0 c\u1ee7a nh\u1eefng ng\u01b0\u1eddi ch\u1ea1y b\u1ed9, c\u1ea7u th\u1ee7 b\u00f3ng r\u1ed5, nh\u1eefng \u0111\u1ee9a tr\u1ebb y\u00eau b\u00f3ng \u0111\u00e1, nh\u1eefng ng\u01b0\u1eddi \u0111am m\u00ea th\u1ec3 h\u00ecnh. Nh\u1eefng ng\u01b0\u1eddi th\u00edch leo n\u00fai v\u00e0o cu\u1ed1i tu\u1ea7n \u0111\u1ec3 tho\u00e1t kh\u1ecfi th\u00e0nh ph\u1ed1. Nh\u1eefng gi\u00e1o vi\u00ean yoga lan t\u1ecfa t\u1eebng \u0111\u1ed9ng t\u00e1c. Bi\u1ec3u t\u01b0\u1ee3ng 3 S\u1ecdc xu\u1ea5t hi\u1ec7n trong l\u00e0ng nh\u1ea1c. Tr\u00ean s\u00e2n kh\u1ea5u, t\u1ea1i c\u00e1c l\u1ec5 h\u1ed9i. Trang ph\u1ee5c th\u1ec3 thao c\u1ee7a ch\u00fang t\u00f4i gi\u00fap b\u1ea1n t\u1eadp trung tr\u01b0\u1edbc ti\u1ebfng c\u00f2i khai cu\u1ed9c. Trong su\u1ed1t cu\u1ed9c \u0111ua. V\u00e0 khi c\u00e1n \u0111\u00edch.
home.story_paragraph4=Ch\u00fang t\u00f4i \u1edf \u0111\u00e2y \u0111\u1ec3 h\u1ed7 tr\u1ee3 nh\u1eefng ng\u01b0\u1eddi s\u00e1ng t\u1ea1o. C\u1ea3i thi\u1ec7n cu\u1ed9c ch\u01a1i c\u1ee7a h\u1ecd. Cu\u1ed9c s\u1ed1ng c\u1ee7a h\u1ecd. V\u00e0 thay \u0111\u1ed5i th\u1ebf gi\u1edbi.
